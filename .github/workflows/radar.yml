name: weekly-radar
on:
  schedule:
    - cron: "37 3 * * 1"        # Mondays 03:37 UTC (09:07 IST)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas pytest && pytest -q
      - name: Run builder radar and SDK shipping check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/radar.py
          python src/package_health.py
          python src/analyse.py
      - name: Commit results
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Weekly radar $(date -u +%F)"
          git push
